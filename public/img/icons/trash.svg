<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" width="32" height="40">
  <!-- Classic Mac OS trash can icon -->
  <!-- Lid -->
  <rect x="2" y="4" width="28" height="4" rx="1" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <!-- Handle on lid -->
  <rect x="11" y="1" width="10" height="4" rx="1" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <!-- Can body (trapezoid) -->
  <path d="M5 8 L7 36 L25 36 L27 8 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <!-- Vertical lines on can -->
  <line x1="11" y1="10" x2="11" y2="34" stroke="#000" stroke-width="1"/>
  <line x1="16" y1="10" x2="16" y2="34" stroke="#000" stroke-width="1"/>
  <line x1="21" y1="10" x2="21" y2="34" stroke="#000" stroke-width="1"/>
</svg>
