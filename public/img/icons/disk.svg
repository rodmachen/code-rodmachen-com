<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 30" width="40" height="30">
  <!-- Top surface (3D perspective) -->
  <polygon points="2,6 36,6 40,2 6,2" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
  <!-- Right side face (darker) -->
  <polygon points="36,6 40,2 40,24 36,28" fill="#aaa" stroke="#222" stroke-width="1"/>
  <!-- Front face (main) -->
  <polygon points="2,6 36,6 36,28 2,28" fill="#ddd" stroke="#222" stroke-width="1"/>
  <!-- Disk insertion slot -->
  <rect x="5" y="11" width="18" height="3" rx="1" fill="#777" stroke="#555" stroke-width="0.5"/>
  <!-- Eject button -->
  <rect x="26" y="10" width="6" height="4" rx="1" fill="#eee" stroke="#888" stroke-width="0.5"/>
  <!-- Activity LED -->
  <circle cx="29" cy="20" r="2" fill="#bbb" stroke="#888" stroke-width="0.5"/>
</svg>
