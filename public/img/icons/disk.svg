<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40" height="36">
  <!-- Hard disk icon, classic Mac OS 8 style -->
  <!-- Drive body -->
  <rect x="2" y="4" width="36" height="28" rx="2" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <!-- Top bevel highlight -->
  <line x1="3" y1="5" x2="37" y2="5" stroke="#fff" stroke-width="1"/>
  <line x1="3" y1="5" x2="3" y2="31" stroke="#fff" stroke-width="1"/>
  <!-- Bottom/right bevel shadow -->
  <line x1="37" y1="5" x2="37" y2="31" stroke="#888" stroke-width="1"/>
  <line x1="3" y1="31" x2="37" y2="31" stroke="#888" stroke-width="1"/>
  <!-- Disk label area -->
  <rect x="6" y="8" width="20" height="13" rx="1" fill="#ddd" stroke="#000" stroke-width="1"/>
  <!-- Label lines -->
  <line x1="8" y1="12" x2="23" y2="12" stroke="#999" stroke-width="1"/>
  <line x1="8" y1="15" x2="20" y2="15" stroke="#999" stroke-width="1"/>
  <!-- Eject button -->
  <rect x="28" y="15" width="6" height="4" rx="1" fill="#ddd" stroke="#000" stroke-width="1"/>
  <!-- LED dot -->
  <circle cx="33" cy="26" r="1.5" fill="#000"/>
</svg>
