<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40" height="36">
  <!-- Drive body -->
  <rect x="1" y="3" width="38" height="30" rx="3" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <!-- Top highlight bevel -->
  <line x1="3" y1="4.5" x2="37" y2="4.5" stroke="#fff" stroke-width="1"/>
  <line x1="2.5" y1="5" x2="2.5" y2="31" stroke="#fff" stroke-width="1"/>
  <!-- Bottom/right shadow bevel -->
  <line x1="37.5" y1="5" x2="37.5" y2="31" stroke="#888" stroke-width="1"/>
  <line x1="3" y1="31.5" x2="37" y2="31.5" stroke="#888" stroke-width="1"/>
  <!-- Drive face panel (darker inset) -->
  <rect x="4" y="6" width="32" height="24" rx="2" fill="#ccc" stroke="#999" stroke-width="1"/>
  <!-- Drive slot (disk insertion slot) -->
  <rect x="8" y="10" width="18" height="3" rx="1" fill="#888" stroke="#555" stroke-width="0.5"/>
  <line x1="8.5" y1="11.5" x2="25.5" y2="11.5" stroke="#aaa" stroke-width="0.5"/>
  <!-- Eject button -->
  <rect x="29" y="10" width="5" height="3" rx="1" fill="#eee" stroke="#888" stroke-width="0.5"/>
  <!-- Activity LED -->
  <circle cx="31.5" cy="22" r="2" fill="#aaa" stroke="#777" stroke-width="0.5"/>
</svg>
